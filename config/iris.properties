# Iris defaults shipped by The Consortium pack (client only; Iris is an optional mod, off by default).
# Shaders stay OFF until the player turns them on in Options > Video Settings > Shader Packs and
# picks a pack there (both shader packs of the pack are optional and off by default, so shaderPack
# stays empty on purpose: a pinned file name would outlive the zip it names when a pack is bumped).
# Iris only writes this file when it is missing, and the launcher never overwrites it once present
# (preserve = true in index.toml), so the pack a player selects survives every sync.
enableShaders=false
shaderPack=
maxShadowRenderDistance=32
colorSpace=SRGB
disableUpdateMessage=true
allowUnknownShaders=false
enableDebugOptions=false
